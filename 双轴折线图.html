<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>团队资源利用率趋势（近 7 天）</title>
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
      background: #f5f7fa;
    }
    .card {
      width: 50%;
      box-sizing: border-box;
      background: #fff;
      border-radius: 8px;
      padding: 20px 24px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
    }
    .title {
      font-size: 16px;
      font-weight: 600;
      color: #1f2937;
      margin-bottom: 4px;
    }
    .subtitle {
      font-size: 12px;
      color: #6b7280;
      margin-bottom: 16px;
    }
    #chart {
      width: 100%;
      height: 480px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="title">团队资源利用率趋势</div>
    <div class="subtitle">统计维度：天</div>
    <div id="chart"></div>
  </div>

  <script>
    // ==================== 生成近 7 天模拟数据（每天一个点） ====================
    function generateData() {
      const now = new Date();
      // 对齐到当天 0 点
      now.setHours(0, 0, 0, 0);

      const timestamps = [];
      const xpuUtil = [];
      const memUtil = [];
      const lockedCards = [];

      for (let i = 6; i >= 0; i--) {
        const t = new Date(now.getTime() - i * 24 * 3600 * 1000);
        timestamps.push(
          `${String(t.getMonth() + 1).padStart(2, "0")}-${String(t.getDate()).padStart(2, "0")}`
        );

        const day = t.getDay();
        // 工作日整体负载更高
        const isWeekday = day >= 1 && day <= 5;
        const base = isWeekday ? 45 : 20;

        const xpu = Math.max(0, Math.min(100, base + (Math.random() - 0.5) * 20));
        const mem = Math.max(0, Math.min(100, base + 25 + (Math.random() - 0.5) * 20));
        const cards = Math.round(100 + (isWeekday ? 50 : 15) + (Math.random() - 0.5) * 20);

        xpuUtil.push(xpu.toFixed(1));
        memUtil.push(mem.toFixed(1));
        lockedCards.push(cards);
      }

      return { timestamps, xpuUtil, memUtil, lockedCards };
    }

    const data = generateData();

    // ==================== 图表配置 ====================
    const chart = echarts.init(document.getElementById("chart"));

    const option = {
      tooltip: {
        trigger: "axis",
        axisPointer: { type: "cross" },
      },
      legend: [
        {
          data: ["XPU 利用率", "显存利用率"],
          left: 100,
          top: 0,
        },
        {
          data: ["占用卡数"],
          right: 100,
          top: 0,
        },
      ],
      grid: {
        left: 60,
        right: 60,
        top: 50,
        bottom: 60,
      },
      xAxis: {
        type: "category",
        boundaryGap: false,
        data: data.timestamps,
        axisLabel: {
          interval: 0,
        },
      },
      yAxis: [
        {
          type: "value",
          name: "利用率 (%)",
          nameTextStyle: { color: "#2563eb" },
          min: 0,
          max: 100,
          position: "left",
          axisLine: { show: true, lineStyle: { color: "#2563eb" } },
          axisLabel: { formatter: "{value}%", color: "#2563eb" },
          splitLine: { lineStyle: { color: "#e5e7eb" } },
        },
        {
          type: "value",
          name: "占用卡数",
          nameTextStyle: { color: "#eab308" },
          min: 0,
          position: "right",
          axisLine: { show: true, lineStyle: { color: "#eab308" } },
          axisLabel: { formatter: "{value} 张", color: "#eab308" },
          splitLine: { show: false },
        },
      ],
      series: [
        {
          name: "XPU 利用率",
          type: "line",
          yAxisIndex: 0,
          data: data.xpuUtil,
          smooth: false,
          symbol: "circle",
          symbolSize: 6,
          lineStyle: { color: "#2563eb", width: 2 },
          itemStyle: { color: "#2563eb" },
        },
        {
          name: "显存利用率",
          type: "line",
          yAxisIndex: 0,
          data: data.memUtil,
          smooth: false,
          symbol: "circle",
          symbolSize: 6,
          lineStyle: { color: "#93c5fd", width: 2 },
          itemStyle: { color: "#93c5fd" },
        },
        {
          name: "占用卡数",
          type: "line",
          yAxisIndex: 1,
          data: data.lockedCards,
          smooth: false,
          symbol: "circle",
          symbolSize: 6,
          lineStyle: { color: "#eab308", width: 2 },
          itemStyle: { color: "#eab308" },
        },
      ],
    };

    chart.setOption(option);
    window.addEventListener("resize", () => chart.resize());
  </script>
</body>
</html>
